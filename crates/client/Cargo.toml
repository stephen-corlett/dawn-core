[package]
name = "client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Faster rebuilds and live asset reloads during development. Never ship a build with
# this enabled.
dev = ["bevy/dynamic_linking", "bevy/file_watcher"]

[dependencies]
bevy = { workspace = true, features = ["default"] }
clap.workspace = true
dotenvy.workspace = true
env_config.workspace = true
foundation.workspace = true
movement = { workspace = true, features = ["client"] }
protocol.workspace = true
lightyear.workspace = true

[dev-dependencies]
bdd.workspace = true
test_support.workspace = true

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/integration/main.rs"
