[workspace]
resolver = "3"
members = ["crates/*", "libs/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[workspace.dependencies]
avatar = { path = "crates/avatar" }
bdd = { path = "libs/bdd" }
client = { path = "crates/client" }
env_config = { path = "libs/env_config" }
foundation = { path = "crates/foundation" }
movement = { path = "crates/movement" }
protocol = { path = "crates/protocol" }
sandbox_kit = { path = "libs/sandbox_kit" }
server = { path = "crates/server" }
test_support = { path = "crates/test_support" }
world = { path = "crates/world" }

# No default features here, so the server never pulls in rendering.
# client turns the full engine back on for itself.
bevy = { version = "0.20", default-features = false, features = [
  "std",
  "bevy_curve",
  "bevy_log",
  "bevy_state",
] }
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
lightyear = { version = "0.31", default-features = false, features = [
  "std",
  "client",
  "server",
  "replication",
  "prediction",
  "interpolation",
  "input_native",
  "netcode",
  "udp",
] }
ron = "0.12"
serde = { version = "1", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Bevy systems routinely take many arguments and large query types.
too_many_arguments = "allow"
type_complexity = "allow"

# Debug info is most of a build's disk use. Line tables keep readable backtraces for
# our code, and dependencies don't need any.
[profile.dev]
debug = "line-tables-only"
opt-level = 1

[profile.dev.package."*"]
debug = false
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
