name: Set up Rust
description: Installs system packages and Rust, and restores the dependency cache.

inputs:
  cache-key:
    description: Which dependency cache to use
    required: true
  save-cache:
    description: Save the dependency cache when the job ends
    default: "false"

runs:
  using: composite
  steps:
    - name: Install Linux dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y g++ pkg-config libx11-dev libasound2-dev libudev-dev libxkbcommon-x11-0 libwayland-dev libxkbcommon-dev
    - name: Install Rust toolchain from rust-toolchain.toml
      shell: bash
      run: rustup show active-toolchain || rustup toolchain install
    # An existing key is never saved over, so use a new cache-key when a Build entry
    # starts compiling something new. Otherwise the new output won't reach the cache.
    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: ${{ inputs.cache-key }}
        save-if: ${{ inputs.save-cache }}
