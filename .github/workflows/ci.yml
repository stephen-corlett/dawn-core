name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          save-cache: "true"
      # Lint reuses the check output, and Test reuses the compiled test dependencies.
      - run: cargo check --workspace --all-targets
      - run: cargo test --workspace --no-run

  lint:
    name: Lint
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: cargo fmt --all --check
      - run: cargo xtask check-architecture
      - run: cargo xtask check-app-sides
      - run: cargo xtask check-tests
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo xtask check-isolated

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Changed line coverage compares against the pull request's base branch.
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - uses: taiki-e/install-action@nextest
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo nextest run --workspace
      - name: Changed line coverage
        if: github.event_name == 'pull_request'
        run: cargo xtask coverage --base origin/${{ github.base_ref }}
