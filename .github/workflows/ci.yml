name: CI

# Pushes to main only run Build, because pull requests can only restore caches saved
# on main. Branch protection requires pull requests to be up to date, so Lint and Test
# have already checked the merged code.
on:
  push:
    branches: [main]
  pull_request:

# A new push to a pull request replaces its running checks. Builds on main always
# finish, so the shared cache stays fresh.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          save-cache: "true"
      - uses: taiki-e/install-action@nextest
      - uses: taiki-e/install-action@cargo-llvm-cov
      # Lint reuses this output.
      - run: cargo check --workspace --all-targets
      # Test reuses this instrumented build. The filter compiles everything and runs
      # nothing.
      - run: cargo llvm-cov nextest --no-report --workspace --exclude xtask --filterset 'none()' --no-tests=pass

  lint:
    name: Lint
    needs: build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: cargo fmt --all --check
      - run: cargo xtask check-architecture
      - run: cargo xtask check-app-sides
      - run: cargo xtask check-tests
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo xtask check-isolated

  # Every test runs once, using the same instrumented build. End-to-end tests run
  # separately so they don't count toward changed line coverage.
  test:
    name: Test
    needs: build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Changed line coverage compares against the pull request's base branch.
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - uses: taiki-e/install-action@nextest
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Unit and integration tests with changed line coverage
        env:
          COVERAGE_COMMENT_PATH: ${{ runner.temp }}/coverage-comment.md
        run: cargo xtask coverage --base origin/${{ github.base_ref }}
      - name: End-to-end tests
        if: ${{ !cancelled() }}
        run: cargo llvm-cov nextest --no-report --workspace --exclude xtask --filterset 'package(e2e)'
      # Forked pull requests can't write comments, which shouldn't fail their checks.
      - name: Comment on the pull request
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          COVERAGE_COMMENT_PATH: ${{ runner.temp }}/coverage-comment.md
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: |
          if [ ! -f "$COVERAGE_COMMENT_PATH" ]; then
            echo "### ⚠️ Diff coverage wasn't measured" > "$COVERAGE_COMMENT_PATH"
            echo "Tests stopped before a report was made. See the Test job." >> "$COVERAGE_COMMENT_PATH"
          fi
          gh pr comment "$PULL_REQUEST" --body-file "$COVERAGE_COMMENT_PATH" --edit-last --create-if-none
